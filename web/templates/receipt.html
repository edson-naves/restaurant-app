{% extends "base.html" %}
{% block body %}
<div class="between">
  <div>
    <h1>Receipt</h1>
    <p class="sub">{{ receipt.kind }} receipt</p>
  </div>
  <div style="display:flex;gap:8px">
    <a class="btn" href="/orders/{{ receipt.order_id }}/pay">← Payment</a>
    <button class="btn primary" onclick="window.print()">Print</button>
  </div>
</div>
<div style="max-width:420px">
  {% include "_receipt_body.html" %}
</div>
{% endblock %}
