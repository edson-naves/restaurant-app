{% extends "base.html" %}
{% block body %}
{% include "admin_nav.html" %}

<div class="between">
  <div>
    <h1>Positions</h1>
    <p class="sub">Jobs and colours that shift blocks are coded by on the schedule.</p>
  </div>
</div>

<div class="card">
  <strong>Add a position</strong>
  <form method="post" action="/admin/positions" class="row" style="gap:10px;align-items:flex-end;margin-top:10px;flex-wrap:wrap">
    <div class="field"><label>Name</label><input type="text" name="name" placeholder="e.g. Barista" required></div>
    <div class="field"><label>Colour</label><input type="color" name="color" value="#3b82f6" class="pos-color"></div>
    <button class="btn good">Add position</button>
  </form>
</div>

<div class="card">
  {% for p in positions %}
  <div class="between" style="border-bottom:1px solid var(--line);padding:8px 0;gap:10px;flex-wrap:wrap;{{ 'opacity:.5' if not p.is_active else '' }}">
    <form method="post" action="/admin/positions/{{ p.id }}/edit" class="row" style="gap:10px;align-items:center;flex-wrap:wrap">
      <input type="color" name="color" value="{{ p.color }}" title="colour" class="pos-color">
      <input type="text" name="name" value="{{ p.name }}" class="pos-name">
      <label class="tick" style="margin:0"><input type="checkbox" name="is_active" value="1" {{ 'checked' if p.is_active else '' }}> active</label>
      <button class="btn sm">Save</button>
    </form>
    <form method="post" action="/admin/positions/{{ p.id }}/delete" onsubmit="return confirm('Remove this position?')">
      <button class="btn sm danger">Remove</button>
    </form>
  </div>
  {% endfor %}
  {% if not positions %}<p class="empty">No positions yet — add one above.</p>{% endif %}
</div>
{% endblock %}
