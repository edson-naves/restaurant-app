<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · RMS</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v() }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🍽️</text></svg>">
</head>
<body class="login-body">
<div class="login-center">

  <div class="login-brand">
    <svg class="login-mark" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v7a2 2 0 0 0 4 0V2M8 2v20"/><path d="M17 2c-1.6 0-2.6 2.2-2.6 5s1 4 2.6 4 2.6-1 2.6-4-1-5-2.6-5zM17 11v11"/></svg>
    <div class="login-logo">RMS</div>
    <p class="login-tag">Restaurant Management System</p>
  </div>

  <div class="login-card">
    <h1>Welcome back</h1>
    <p class="login-sub">Please sign in to continue</p>

    {% if error %}
    <div class="err login-err">That name and PIN don't match. Try again.</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="login-field">
        <label class="login-label" for="who">Who are you?</label>
        <div class="login-input-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
          <select name="staff_id" id="who" required>
            {% for s in staff %}
            <option value="{{ s.id }}">{{ s.name }} — {{ s.role.replace('_', ' ') }}</option>
            {% endfor %}
          </select>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>

      <div class="login-field">
        <label class="login-label" for="pin">PIN</label>
        <div class="login-input-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input type="password" name="pin" id="pin" inputmode="numeric" autocomplete="off"
                 pattern="[0-9]{4,8}" placeholder="••••" required autofocus>
          <button type="button" class="login-eye" onclick="togglePin(this)" aria-label="Show or hide PIN">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.5 9.5 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2m-6.7-1.1a3 3 0 0 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>

      <p class="login-hint" id="pinHint" hidden>Ask an owner or manager to reset your PIN under Manage → Staff.</p>

      <div class="login-row">
        <label class="login-remember"><input type="checkbox" name="remember" checked> Remember me on this device</label>
        <a class="login-link" href="#" onclick="forgotPin(event)">Forgot PIN?</a>
      </div>

      <button class="btn primary login-btn">
        Sign in
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <p class="login-foot">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V5z"/><path d="M9 12l2 2 4-4"/></svg>
      Secure system
    </p>
  </div>
</div>

<script>
  function togglePin(btn) {
    var i = document.getElementById('pin');
    var showing = i.type === 'password';
    i.type = showing ? 'text' : 'password';
    btn.querySelector('.eye').style.display = showing ? 'none' : 'block';
    btn.querySelector('.eye-off').style.display = showing ? 'block' : 'none';
    i.focus();
  }
  function forgotPin(e) {
    e.preventDefault();
    document.getElementById('pinHint').hidden = false;
  }
</script>
</body>
</html>
